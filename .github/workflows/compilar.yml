name: Compilar Meu Frete

# A cada envio: analise do codigo, testes das contas, imagens da Play Store,
# AAB (Play Store, sem trava de licenca e sem internet) e APK de venda direta
# (com o portao da Central de Licencas 3), os dois assinados com a chave de
# envio do Meu Frete quando ela estiver nos segredos.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  compilar:
    name: Validar, testar e compilar
    runs-on: ubuntu-latest
    outputs:
      numero: ${{ steps.montar.outputs.numero }}
      assinado: ${{ steps.chave.outputs.assinado }}
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analise do codigo (flutter analyze)
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos 2>&1 | tee analise.log; then
            grep -E "error|warning" analise.log | head -60 | while IFS= read -r l; do echo "::error title=flutter analyze::$l"; done
            exit 1
          fi

      - name: Testes das contas e das telas
        run: |
          set -o pipefail
          if ! flutter test --exclude-tags capturas 2>&1 | tee teste.log; then
            grep -E "FAILED|\[E\]|Expected:|Actual:|Error:|error:|Exception|Which:|══" teste.log | head -60 | while IFS= read -r l; do echo "::error title=flutter test::$l"; done
            exit 1
          fi

      - name: Imagens da Play Store e PDFs de exemplo
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --tags capturas --update-goldens 2>&1 | tee capturas.log
          ls -la test/capturas || true

      - name: Guardar os registros da esteira no repositorio (quando falha)
        if: failure()
        run: |
          mkdir -p logs/esteira
          rm -f logs/esteira/*
          for f in analise.log teste.log capturas.log build.log build-aab.log; do [ -f "$f" ] && cp "$f" logs/esteira/; done
          git config user.name "acoes"
          git config user.email "acoes@local"
          git add logs/esteira
          git commit -m "registro da esteira com falha (montagem ${{ github.run_number }}) [skip ci]" || exit 0
          git push || (git pull --rebase && git push) || true

      - name: Publicar as imagens (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            test/capturas/*.png
            test/capturas/*.pdf
            test/failures/*.png
          if-no-files-found: ignore

      - name: Preparar a chave de envio da Play Store
        id: chave
        env:
          CHAVE: ${{ secrets.MEUFRETE_UPLOAD_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.MEUFRETE_UPLOAD_KEYSTORE_SENHA }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then
            echo "::notice::Sem a chave nos segredos: sai com a chave de teste e a assinatura final e feita fora da esteira."
            echo "ASSINADO=nao" >> "$GITHUB_ENV"
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/meufrete-upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/meufrete-upload.jks" "$SENHA" "meufrete" "$SENHA" > android/key.properties
          echo "ASSINADO=sim" >> "$GITHUB_ENV"
          echo "assinado=sim" >> "$GITHUB_OUTPUT"

      - name: Compilar AAB (Play Store) e APK (venda direta)
        id: montar
        run: |
          NUMERO=$((2000 + ${{ github.run_number }}))
          echo "NUMERO=$NUMERO" >> "$GITHUB_ENV"
          echo "numero=$NUMERO" >> "$GITHUB_OUTPUT"
          set -o pipefail
          # 1) Play Store: SEM o portao de licenca e SEM permissao de internet,
          #    como a ficha da loja promete (a propria loja cobra o app).
          if ! flutter build appbundle --release --build-number=$NUMERO --dart-define=LICENCA_CENTRAL=false 2>&1 | tee build-aab.log; then
            grep -E "^e: |error:|What went wrong|FAILURE|Exception" -A3 build-aab.log | head -60 | while IFS= read -r l; do echo "::error title=flutter build appbundle::$l"; done
            exit 1
          fi
          mkdir -p saida
          cp build/app/outputs/bundle/release/app-release.aab saida/MeuFrete.aab
          if unzip -p saida/MeuFrete.aab base/manifest/AndroidManifest.xml | grep -a -q "android.permission.INTERNET"; then
            echo "ERRO: o AAB da Play Store nao pode pedir internet"; exit 1
          fi
          echo "AAB da Play Store: sem portao e sem internet (conferido)."
          # 2) Venda direta (APK por WhatsApp): passa pela Central de Licencas 3.
          #    So este APK ganha a permissao de internet (para pedir a liberacao).
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || { echo "ERRO: nao consegui por a permissao de internet no APK"; exit 1; }
          if ! flutter build apk --release --build-number=$NUMERO --dart-define=LICENCA_CENTRAL=true 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|FAILURE|Exception" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error title=flutter build apk::$l"; done
            exit 1
          fi
          git checkout android/app/src/main/AndroidManifest.xml
          # O APK de venda direta so sai com a chave FIXA do Meu Frete: com outra
          # chave o codigo do aparelho mudaria e o cliente perderia a liberacao
          # ao atualizar. Sem a chave nos segredos, ele e conferido mas nao sai.
          APK=MeuFrete.apk
          echo "APK=$APK" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "saida/$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump permissions "saida/$APK" | tee permissoes.txt
          grep -q "android.permission.INTERNET" permissoes.txt || { echo "ERRO: o APK de venda direta precisa de internet"; exit 1; }
          ls -la saida
          echo "$(grep '^version:' pubspec.yaml) | codigo de versao: $NUMERO"

      - name: Guardar o APK de venda direta para abrir no emulador
        uses: actions/upload-artifact@v4
        with:
          name: meufrete-conferencia
          path: saida/MeuFrete.apk
          retention-days: 3

      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "saida/$APK" | tee assinatura.txt
          keytool -printcert -jarfile saida/MeuFrete.aab | head -20 || true
          echo "::notice title=Assinatura::Chave da Play Store: $ASSINADO | codigo de versao $NUMERO"

      - name: Sem a chave fixa, o APK de venda direta nao e publicado
        if: env.ASSINADO != 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f saida/MeuFrete.apk
          gh release delete-asset versao-mais-recente MeuFrete.apk -y -R "${{ github.repository }}" || true
          echo "::notice title=APK de venda direta::Compilado e conferido, mas so e publicado assinado com a chave fixa do Meu Frete (segredos MEUFRETE_UPLOAD_KEYSTORE_BASE64 e MEUFRETE_UPLOAD_KEYSTORE_SENHA)."

      - name: Tirar do Release o arquivo antigo de teste
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset versao-mais-recente MeuFrete-venda-direta-TESTE.apk -y -R "${{ github.repository }}" || true

      - name: Publicar APK e AAB (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: meufrete
          path: |
            saida/*.apk
            saida/MeuFrete.aab

      - name: Juntar as imagens da loja
        if: always()
        run: |
          mkdir -p saida
          if ls test/capturas/* >/dev/null 2>&1; then (cd test && zip -qr ../saida/capturas.zip capturas); fi
          if ls test/failures/* >/dev/null 2>&1; then (cd test && zip -qr ../saida/falhas.zip failures); fi
          ls -la saida

      - name: Guardar as imagens da loja (zip)
        uses: actions/upload-artifact@v4
        with:
          name: capturas-zip
          path: saida/capturas.zip
          if-no-files-found: ignore

  emulador:
    name: Abrir no celular virtual (nao pode fechar)
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: meufrete-conferencia
          path: saida

      - name: Ligar a aceleracao do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o Meu Frete (venda direta) no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/abrir-no-emulador.sh br.com.fortalezadigitalsecurity.meufrete saida/MeuFrete.apk

      - name: Guardar fotos e registro do emulador no repositorio
        if: always()
        run: |
          mkdir -p logs/emulador
          cp registro-emulador/* logs/emulador/ 2>/dev/null || true
          git config user.name "acoes"
          git config user.email "acoes@local"
          git add logs/emulador
          git commit -m "registro do emulador (montagem ${{ github.run_number }}) [skip ci]" || exit 0
          git push || (git pull --rebase && git push) || true

  publicar:
    name: Publicar (depois do emulador)
    needs: [compilar, emulador]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meufrete
          path: saida

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: capturas-zip
          path: saida

      - name: Baixar o APK de venda direta (para a assinatura final fora da esteira)
        if: needs.compilar.outputs.assinado != 'sim'
        uses: actions/download-artifact@v4
        with:
          name: meufrete-conferencia
          path: interno

      - name: Guardar o APK sem a chave fixa num Release interno (NAO e para instalar)
        if: needs.compilar.outputs.assinado != 'sim'
        run: mv interno/MeuFrete.apk "interno/MeuFrete-NAO-INSTALAR-assinar-fora.apk"

      - name: Release interno (so para a assinatura final)
        if: needs.compilar.outputs.assinado != 'sim'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: interno-para-assinar
          name: INTERNO - nao instalar
          body: |
            Arquivo de trabalho: o APK de venda direta ainda sem a chave fixa do Meu Frete.
            NAO instale nem mande para cliente. A versao para usar e a "versao-mais-recente", depois de assinada.
          files: interno/MeuFrete-NAO-INSTALAR-assinar-fora.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar como Release (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: versao-mais-recente
          name: Meu Frete - versao mais recente
          body: |
            Meu Frete 2.2 (Flutter). MeuFrete.aab e o arquivo para a Play Store (sem trava de licenca e sem internet).
            MeuFrete.apk e a venda direta por WhatsApp: so abre no aparelho liberado pela Central de Licencas (so e publicado com a chave fixa).
            Codigo de versao ${{ needs.compilar.outputs.numero }}. Chave fixa na esteira: ${{ needs.compilar.outputs.assinado }}. Aberto no celular virtual antes de publicar.
          files: |
            saida/*.apk
            saida/MeuFrete.aab
            saida/capturas.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
